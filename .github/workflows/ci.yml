name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore SmartAgenda.sln
      - run: dotnet build SmartAgenda.sln --no-restore -c Release
      - run: dotnet test SmartAgenda.sln --no-build -c Release --verbosity normal
