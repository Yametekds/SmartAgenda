name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore SmartAgenda.sln
      - run: dotnet build SmartAgenda.sln --no-restore -c Release
      - run: dotnet test SmartAgenda.sln --no-build -c Release --verbosity normal

  # App Android: genera un APK que se instala directamente en el móvil (sin Google Play).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet workload install maui-android
      # Si el repositorio tiene la clave de firma en sus secretos (ver README), el APK se firma
      # siempre con ella y cada versión se instala encima de la anterior sin perder datos.
      - name: Preparar la clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/smartagenda.keystore"
            echo "FIRMA=-p:AndroidKeyStorePath=$RUNNER_TEMP/smartagenda.keystore -p:AndroidKeyAlias=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          fi
      - name: Compilar el APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          dotnet publish SmartAgenda.Movil/SmartAgenda.Movil.csproj -f net9.0-android -c Release -o publicado
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:ApplicationVersion=${{ github.run_number }} $FIRMA
      - uses: actions/upload-artifact@v4
        with:
          name: SmartAgenda-android
          path: publicado/*-Signed.apk
          if-no-files-found: error
